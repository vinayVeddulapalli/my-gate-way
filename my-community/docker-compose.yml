version: '3.8'

services:
  # Local PostgreSQL Database (Zero-cost, persistent storage)
  postgres:
    image: postgres:16-alpine
    container_name: mycommunity_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-my_community_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - community_network

  # Local Redis (Zero-cost, fast in-memory queue for BullMQ background jobs)
  redis:
    image: redis:7-alpine
    container_name: mycommunity_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - community_network

  # Adminer: Free Web-based Database Viewer (Access at http://localhost:8080)
  # Allows you to visually inspect all tables, visitors, and residents in your browser
  adminer:
    image: adminer:latest
    container_name: mycommunity_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - community_network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  community_network:
    driver: bridge
